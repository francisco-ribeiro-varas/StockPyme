<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPyme - Panel de Inventario</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .form-section { background: #fdfdfd; padding: 15px; border: 1px solid #e1e8ed; border-radius: 6px; margin-bottom: 30px; }
        .form-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .form-row input, .form-row button { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .form-row input[type="text"], .form-row input[type="number"] { flex: 1; min-width: 120px; }
        .form-row input[type="file"] { flex: 1.5; min-width: 180px; background: #fff; }
        .btn-guardar { background-color: #2ecc71; color: white; border: none; font-weight: bold; cursor: pointer; padding: 10px 20px !important; }
        .btn-guardar:hover { background-color: #27ae60; }
        .btn-eliminar { background-color: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-eliminar:hover { background-color: #c0392b; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background-color: #3498db; color: white; text-align: left; padding: 12px; font-size: 15px; }
        td { padding: 12px; border-bottom: 1px solid #e1e8ed; font-size: 14px; vertical-align: middle; }
        tr:hover { background-color: #f9fbfd; }
        .img-miniatura { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; background-color: #f4f4f4; }
        .header-logout { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-logout { background-color: #7f8c8d; color: white; text-decoration: none; padding: 8px 15px; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-logout">
            <h2>Gestión de Inventario</h2>
            <a href="/logout" class="btn-logout">Cerrar Sesión</a>
        </div>

        <div class="form-section">
            <h3>Añadir u Optimizar Producto</h3>
            <form id="tuFormularioProducto" enctype="multipart/form-data" class="form-row">
                <input type="text" name="nombre" placeholder="Nombre del producto" required>
                <input type="text" name="categoria" placeholder="Categoría (opcional)">
                <input type="number" name="cantidad" placeholder="Cantidad" min="1" required>
                <input type="number" step="0.01" name="precio" placeholder="Precio" min="0" required>
                
                <input type="file" name="imagen" accept="image/*" required>
                
                <button type="submit" class="btn-guardar">Guardar</button>
            </form>
        </div>

        <h3>Lista de Inventario</h3>
        <table>
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Cantidad Disponible</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaCuerpo">
                </tbody>
        </table>
    </div>

    <script>
        // Cargar los productos al iniciar la página
        async function cargarProductos() {
            try {
                const res = await fetch('/api/productos');
                if (!res.ok) return;
                const productos = await res.json();
                
                const cuerpo = document.getElementById('tablaCuerpo');
                cuerpo.innerHTML = '';
                
                productos.forEach(prod => {
                    const tr = document.createElement('tr');
                    const srcImagen = prod.imagen_url ? prod.imagen_url : '';
                    
                    tr.innerHTML = `
                        <td><img src="${srcImagen}" alt="Foto" class="img-miniatura" onerror="this.src='https://placehold.co/50x50?text=No+Img'"></td>
                        <td>${prod.nombre}</td>
                        <td>${prod.categoria}</td>
                        <td style="${prod.cantidad <= 5 ? 'color:red; font-weight:bold;' : ''}">${prod.cantidad}</td>
                        <td>$${prod.precio}</td>
                        <td><button class="btn-eliminar" onclick="eliminarProducto(${prod.id})">Eliminar</button></td>
                    `;
                    cuerpo.appendChild(tr);
                });
            } catch (err) {
                console.error("Error al cargar el inventario:", err);
            }
        }

        // CONTROL DE ENVÍO DE FORMULARIO
        const formulario = document.getElementById('tuFormularioProducto');

        if (!formulario) {
            alert("⚠️ ¡ERROR CRÍTICO EN FRONTEND!: No se encontró el formulario con el ID 'tuFormularioProducto'");
        } else {
            formulario.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                console.log("--> Iniciando envío de datos multimedia...");
                alert("Enviando datos a Flask y Azure... Presiona OK para continuar.");

                const formData = new FormData(formulario);

                try {
                    const respuesta = await fetch('/api/productos', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const resultado = await respuesta.json();
                    console.log("Respuesta del servidor:", resultado);

                    if (resultado.status === 'success') {
                        alert("🎉 ¡Producto guardado con éxito en Oracle y Azure!");
                        formulario.reset();
                        cargarProductos();
                    } else {
                        alert("❌ Error de Flask: " + resultado.message);
                    }
                } catch (err) {
                    console.error("Error de red detectado:", err);
                    alert("❌ Error de red: No se pudo entablar conexión con app.py.");
                }
            });
        }

        // Eliminar producto
        async function eliminarProducto(id) {
            if (!confirm('¿Deseas eliminar este registro del inventario?')) return;
            try {
                const res = await fetch(`/api/productos/eliminar/${id}`, { method: 'DELETE' });
                const resultado = await res.json();
                if (resultado.status === 'success') {
                    cargarProductos();
                } else {
                    alert("No se pudo eliminar.");
                }
            } catch (err) {
                alert("Error de conexión.");
            }
        }

        // Carga inicial
        cargarProductos();
    </script>
</body>
</html>
